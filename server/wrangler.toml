name = "dropguard-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
APP_BASE_URL = "https://dropguard-api.dropguard.workers.dev"

# KV namespace for Pro devices and rate limiting
# You can generate production & preview IDs using:
# npx wrangler kv namespace create DROP_GUARD_KV
# npx wrangler kv namespace create DROP_GUARD_KV --preview
[[kv_namespaces]]
binding = "DROP_GUARD_KV"
id = "d470a7d2fecc4d0e9f4118eaeb18607f"
preview_id = "dropguard_kv_preview_placeholder"
